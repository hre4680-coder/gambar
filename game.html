<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lomba Gambar · Arena Kreatif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0B1120, #030614);
            min-height: 100vh;
            padding: 16px;
            color: #F1F5F9;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 56px;
            padding: 20px 24px;
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 25px 45px -12px black;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #0F172A80;
            padding: 12px 24px;
            border-radius: 80px;
            margin-bottom: 28px;
            border: 1px solid #334155;
        }
        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FDE68A, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .phase-badge {
            background: #1E293B;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border-left: 3px solid #F59E0B;
        }
        .timer {
            background: #00000066;
            font-family: monospace;
            font-size: 2rem;
            font-weight: bold;
            padding: 4px 18px;
            border-radius: 60px;
            background: #E67E22;
            color: white;
            text-shadow: 0 0 4px black;
            letter-spacing: 2px;
        }
        .theme-tag {
            background: #8B5CF6;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .exit-btn {
            background: #EF4444;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .exit-btn:hover {
            background: #DC2626;
            transform: scale(0.96);
        }

        .player-glass {
            background: #1E293B80;
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 18px;
            margin: 20px auto;
            max-width: 550px;
            text-align: center;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            list-style: none;
            margin-top: 12px;
        }
        .player-list li {
            background: #0F172A;
            padding: 8px 22px;
            border-radius: 40px;
            border-left: 3px solid #FBBF24;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .drawing-area {
            background: #111827;
            border-radius: 48px;
            padding: 20px;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            cursor: crosshair;
            border: 3px solid #F59E0B;
        }
        .tools {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
        }
        .tools button, .tools input {
            padding: 10px 18px;
            border-radius: 60px;
            border: none;
            background: #2D3A5E;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .tools button:active { transform: scale(0.96);}
        #submitDrawingBtn { background: #10B981; color: black; }
        .bg-color-picker {
            background: #1E293B;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 60px;
            padding: 4px 12px;
        }

        .rating-carousel {
            background: #0F172A;
            border-radius: 48px;
            padding: 24px;
            margin-top: 12px;
        }
        .rating-card {
            background: #1E293B;
            border-radius: 36px;
            padding: 24px;
            text-align: center;
            max-width: 650px;
            margin: 0 auto;
        }
        .rating-card img {
            max-width: 100%;
            border-radius: 28px;
            max-height: 280px;
            object-fit: contain;
            background: white;
            border: 2px solid gold;
            margin-bottom: 12px;
        }
        .rating-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }
        .emoji-btn {
            font-size: 2rem;
            background: #2D3A5E;
            border: none;
            border-radius: 60px;
            padding: 6px 18px;
            cursor: pointer;
            transition: 0.1s;
        }
        .star-rating span {
            font-size: 2rem;
            cursor: pointer;
            color: #CBD5E1;
            transition: 0.05s linear;
        }
        .star-rating span.active { color: #FBBF24; text-shadow: 0 0 4px gold;}
        .rating-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .rating-nav button {
            background: #F59E0B;
            padding: 8px 28px;
            font-size: 1rem;
        }

        .winners-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 700px;
            margin: 20px auto;
        }
        .winner-entry {
            background: #1E293B;
            border-radius: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .winner-entry img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 24px;
            border: 2px solid #FBBF24;
        }
        .medal { font-size: 2.2rem; width: 60px; text-align: center; }
        .winner-detail { flex:1; font-weight: bold; }

        .hidden { display: none; }
        button, .emoji-btn { cursor: pointer; transition: 0.1s ease; }
        @media (max-width: 650px) {
            .game-container { padding: 14px; }
            .timer { font-size: 1.3rem; }
            .game-title { font-size: 1.1rem; }
            .star-rating span { font-size: 1.5rem; }
            .winner-entry img { width: 65px; height: 65px; }
            .exit-btn { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="game-title">🎨 LOMBA GAMBAR</div>
        <div class="badge-group">
            <span class="phase-badge" id="phaseLabel">⏳ MENUNGGU</span>
            <span class="timer" id="timerDisplay">00:00</span>
            <span id="themeBadge" class="theme-tag hidden">🎯 Tema: -</span>
        </div>
        <button id="exitGameBtn" class="exit-btn">🚪 Keluar</button>
    </div>

    <!-- WAITING PHASE (player list) -->
    <div id="waitingPhase">
        <div class="player-glass">
            <h3>👥 Peserta yang bergabung</h3>
            <ul class="player-list" id="playerList"></ul>
            <button id="startGameBtn" class="hidden" style="background:#F59E0B; margin-top:20px;">🚀 Mulai Lomba</button>
        </div>
    </div>

    <!-- DRAWING PHASE -->
    <div id="drawingPhase" class="hidden">
        <div class="drawing-area">
            <canvas id="drawCanvas" width="700" height="450"></canvas>
            <div class="tools">
                <button id="clearCanvas">🧽 Hapus</button>
                <input type="color" id="colorPicker" value="#000000" title="Warna kuas">
                <span>✏️</span><input type="range" id="brushSize" min="1" max="30" value="3">
                <div class="bg-color-picker">
                    <span>🎨 Background:</span>
                    <input type="color" id="bgColorPicker" value="#ffffff" title="Warna latar canvas">
                    <button id="applyBgBtn">Terapkan</button>
                </div>
                <button id="submitDrawingBtn">💾 Simpan & Kirim</button>
            </div>
            <p class="info-text" style="margin-top:12px;">✨ Karya terbaikmu! Jangan lupa simpan sebelum waktu habis.</p>
        </div>
    </div>

    <!-- RATING PHASE (carousel) -->
    <div id="ratingPhase" class="hidden">
        <div class="rating-carousel">
            <div id="ratingCardContainer"></div>
            <div class="rating-nav">
                <button id="prevRatingBtn" class="hidden">⬅ Sebelumnya</button>
                <button id="nextRatingBtn" class="hidden">Berikutnya ➡</button>
            </div>
            <p id="ratingProgress" style="text-align:center; margin-top:12px;"></p>
        </div>
    </div>

    <!-- RESULT PHASE (pemenang + karya) -->
    <div id="resultPhase" class="hidden">
        <div id="winnerDisplay"></div>
        <div style="text-align:center; margin-top:30px;">
            <button onclick="window.location.href='/dashboard'">🏠 Kembali ke Beranda</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const gameId = window.location.pathname.split('/').pop();
    let currentUserId = null, currentUsername = null, isHost = false;
    let myDrawingSubmitted = false;
    let canvas, ctx, painting = false;
    let allOtherDrawings = [], currentIdx = 0, ratingsGiven = {};
    let gameTheme = '';

    // helper fetch user
    async function fetchUser() {
        try {
            const res = await fetch('/api/me');
            if (res.ok) {
                const data = await res.json();
                currentUserId = data.id;
                currentUsername = data.username;
                socket.emit('join-game', { gameId, userId: currentUserId, username: currentUsername });
                setInterval(() => socket.emit('request-players', { gameId }), 3500);
            } else window.location.href = '/';
        } catch(e) { window.location.href = '/'; }
    }

    // UI Phase
    function showPhase(phase) {
        document.getElementById('waitingPhase').classList.add('hidden');
        document.getElementById('drawingPhase').classList.add('hidden');
        document.getElementById('ratingPhase').classList.add('hidden');
        document.getElementById('resultPhase').classList.add('hidden');
        if (phase === 'waiting') document.getElementById('waitingPhase').classList.remove('hidden');
        if (phase === 'drawing') document.getElementById('drawingPhase').classList.remove('hidden');
        if (phase === 'rating') document.getElementById('ratingPhase').classList.remove('hidden');
        if (phase === 'result') document.getElementById('resultPhase').classList.remove('hidden');
    }

    // daftar pemain
    socket.on('players-list', ({ players, hostId }) => {
        const listEl = document.getElementById('playerList');
        if (listEl) {
            listEl.innerHTML = players.map(p => `<li>${escapeHtml(p.username)}${p.id == hostId ? ' 👑' : ''}</li>`).join('');
        }
        if (hostId == currentUserId) {
            const startBtn = document.getElementById('startGameBtn');
            if (startBtn) startBtn.classList.remove('hidden');
            startBtn.onclick = () => socket.emit('start-game', { gameId });
        }
    });

    // game-status & theme
    socket.on('game-status', (data) => {
        isHost = (data.hostId == currentUserId);
        gameTheme = data.theme || 'Bebas';
        if (gameTheme) {
            const themeSpan = document.getElementById('themeBadge');
            themeSpan.innerText = `🎨 Tema: ${gameTheme}`;
            themeSpan.classList.remove('hidden');
        }
        if (data.status === 'waiting') {
            showPhase('waiting');
            if (isHost) document.getElementById('startGameBtn').classList.remove('hidden');
        } else if (data.status === 'drawing') {
            showPhase('drawing');
            initDrawing();
            myDrawingSubmitted = false;
        } else if (data.status === 'rating') {
            showPhase('rating');
            socket.emit('request-drawings', { gameId });
        } else if (data.status === 'finished') {
            showPhase('result');
        }
    });

    socket.on('phase-change', ({ status }) => {
        if (status === 'rating') {
            showPhase('rating');
            socket.emit('request-drawings', { gameId });
        } else if (status === 'drawing') {
            showPhase('drawing');
            initDrawing();
            myDrawingSubmitted = false;
        }
    });

    // Timer
    socket.on('timer-update', ({ remaining, phase }) => {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        document.getElementById('timerDisplay').innerText = `${mins}:${secs<10?'0'+secs:secs}`;
        document.getElementById('phaseLabel').innerHTML = phase === 'drawing' ? '🎨 MENGGAMBAR' : '⭐ MENILAI';
        if (remaining === 0 && phase === 'drawing' && !myDrawingSubmitted) {
            alert('⏰ Waktu habis! Gambar otomatis dikirim.');
            saveDrawingAndSubmit(true);
        }
    });

    // menerima daftar gambar untuk rating (hanya karya orang lain)
    socket.on('drawings-list', ({ drawings }) => {
        allOtherDrawings = drawings.filter(d => d.user_id != currentUserId);
        if (allOtherDrawings.length === 0) {
            document.getElementById('ratingCardContainer').innerHTML = '<div style="text-align:center;padding:40px;">✨ Belum ada gambar dari peserta lain ✨</div>';
            document.getElementById('prevRatingBtn').classList.add('hidden');
            document.getElementById('nextRatingBtn').classList.add('hidden');
            return;
        }
        currentIdx = 0;
        ratingsGiven = {};
        renderRatingCard(currentIdx);
        document.getElementById('prevRatingBtn').classList.remove('hidden');
        document.getElementById('nextRatingBtn').classList.remove('hidden');
        document.getElementById('prevRatingBtn').onclick = () => { if (currentIdx > 0) { currentIdx--; renderRatingCard(currentIdx); } };
        document.getElementById('nextRatingBtn').onclick = () => { if (currentIdx < allOtherDrawings.length-1) { currentIdx++; renderRatingCard(currentIdx); } else { alert('🎉 Semua gambar sudah dinilai! Terima kasih.'); } };
    });

    function renderRatingCard(idx) {
        const draw = allOtherDrawings[idx];
        if (!draw) return;
        const currentRating = ratingsGiven[draw.id] || 0;
        const container = document.getElementById('ratingCardContainer');
        container.innerHTML = `
            <div class="rating-card">
                <img src="${draw.image_data}" alt="Karya ${draw.username}">
                <h3>🎨 ${escapeHtml(draw.username)}</h3>
                <div class="rating-actions">
                    <button class="emoji-btn" data-type="good">👍 +1</button>
                    <button class="emoji-btn" data-type="bad">👎 -1</button>
                    <div class="star-rating" data-did="${draw.id}">
                        ${[1,2,3,4,5].map(s => `<span data-val="${s}" class="${currentRating >= s ? 'active' : ''}">★</span>`).join('')}
                    </div>
                    <span class="rating-value">Nilai: ${currentRating} ★</span>
                </div>
            </div>
        `;
        // star click
        container.querySelectorAll('.star-rating span').forEach(star => {
            star.addEventListener('click', (e) => {
                const val = parseInt(star.dataset.val);
                ratingsGiven[draw.id] = val;
                updateStarUI(container, val);
                socket.emit('submit-rating', { drawingId: draw.id, ratingValue: val });
                document.getElementById('ratingProgress').innerText = `Gambar ${idx+1}/${allOtherDrawings.length} · Nilai ${val} ★`;
            });
        });
        // emoji
        container.querySelector('[data-type="good"]')?.addEventListener('click', () => adjustRating(draw.id, +1, idx, container));
        container.querySelector('[data-type="bad"]')?.addEventListener('click', () => adjustRating(draw.id, -1, idx, container));
        document.getElementById('ratingProgress').innerText = `Gambar ${idx+1} dari ${allOtherDrawings.length}`;
    }

    function adjustRating(drawingId, delta, idx, container) {
        let cur = ratingsGiven[drawingId] || 0;
        let newVal = Math.min(5, Math.max(0, cur + delta));
        ratingsGiven[drawingId] = newVal;
        updateStarUI(container, newVal);
        socket.emit('submit-rating', { drawingId, ratingValue: newVal });
        document.getElementById('ratingProgress').innerText = `Gambar ${idx+1}/${allOtherDrawings.length} · Nilai ${newVal} ★`;
    }

    function updateStarUI(container, rating) {
        const stars = container.querySelectorAll('.star-rating span');
        stars.forEach((star, i) => {
            if (i < rating) star.classList.add('active');
            else star.classList.remove('active');
        });
        const valSpan = container.querySelector('.rating-value');
        if (valSpan) valSpan.innerText = `Nilai: ${rating} ★`;
    }

    // final winner (1-3 with image)
    socket.on('game-finished', ({ winners }) => {
        showPhase('result');
        if (!winners || winners.length === 0) {
            document.getElementById('winnerDisplay').innerHTML = '<div style="text-align:center;">Tidak ada pemenang</div>';
            return;
        }
        let html = '<div class="winners-grid"><h2 style="text-align:center;">🏆 JUARA LOMBA 🏆</h2>';
        winners.forEach((w, idx) => {
            const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : '🥉');
            html += `
                <div class="winner-entry">
                    <div class="medal">${medal}</div>
                    <img src="${w.image_data}" alt="karya pemenang">
                    <div class="winner-detail">
                        <strong>${escapeHtml(w.username)}</strong><br>
                        ⭐ ${w.total_rating} poin
                    </div>
                </div>
            `;
        });
        html += '</div>';
        document.getElementById('winnerDisplay').innerHTML = html;
    });

    // DRAWING LOGIC + Background color changer
    function initDrawing() {
        canvas = document.getElementById('drawCanvas');
        ctx = canvas.getContext('2d');
        // set background awal putih
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        painting = false;

        // tombol ganti background
        const applyBg = document.getElementById('applyBgBtn');
        applyBg.onclick = () => {
            const bgColor = document.getElementById('bgColorPicker').value;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // agar gambar lama tidak hilang, kita perlu mengambil data gambar sebelumnya?
            // cara lebih baik: simpan dulu data gambar, lalu timpa dengan background, lalu restore?
            // Tapi untuk kemudahan, kita timpa background saja, gambar akan hilang (karena ini fitur opsional).
            // User bisa menggambar ulang. Biarkan sederhana.
        };

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            let x = (cx - rect.left) * scaleX;
            let y = (cy - rect.top) * scaleY;
            return { x: Math.min(Math.max(0, x), canvas.width), y: Math.min(Math.max(0, y), canvas.height) };
        }
        function start(e) {
            painting = true;
            const p = getCoords(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        function draw(e) {
            if (!painting) return;
            const p = getCoords(e);
            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineCap = 'round';
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        }
        function end() {
            painting = false;
            ctx.beginPath();
        }
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('touchstart', start);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', end);
        document.getElementById('clearCanvas').onclick = () => {
            const currentBg = document.getElementById('bgColorPicker').value;
            ctx.fillStyle = currentBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        };
        document.getElementById('submitDrawingBtn').onclick = () => saveDrawingAndSubmit(false);
    }

    function saveDrawingAndSubmit(isAuto) {
        if (myDrawingSubmitted) { if(!isAuto) alert('Sudah dikirim'); return; }
        const imageData = canvas.toDataURL('image/png');
        socket.emit('submit-drawing', { gameId, imageData });
        myDrawingSubmitted = true;
        if(!isAuto) alert('✅ Gambar tersimpan!');
    }

    // Tombol keluar: kembali ke dashboard
    document.getElementById('exitGameBtn').addEventListener('click', () => {
        if (confirm("Keluar dari game? Kamu bisa masuk lagi nanti dengan kode yang sama.")) {
            window.location.href = '/dashboard';
        }
    });

    function escapeHtml(str) { return str ? String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : ''; }

    fetchUser();
</script>
</body>
</html>
